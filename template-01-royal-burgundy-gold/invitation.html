<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wedding Invitation | Saurabh.AICreates</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f0f0;font-family:Georgia,"Times New Roman",serif;color:#4b1024}.page{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px}.events{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 auto 14px;max-width:1000px}.events button{border:1px solid #b99a54;border-radius:22px;background:#fff;color:#4b1024;padding:9px 14px;cursor:pointer;font:13px Arial,sans-serif}.events button.active{background:#4b1024;color:#f4d47e}.artboard{position:relative;width:min(100%,520px);line-height:0}.artboard img{display:block;width:100%;height:auto;max-height:calc(100vh - 100px);object-fit:contain}.overlay{position:absolute;left:12%;right:12%;top:39%;height:31%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.3;color:#d9b65d;text-shadow:0 1px 2px #4b1024aa;pointer-events:none}.eyebrow{font:clamp(8px,2vw,12px) Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;margin:0 0 12px}.names{font-size:clamp(25px,6vw,43px);margin:0;line-height:1.15}.amp{font-size:clamp(17px,4vw,26px);margin:5px 0}.details{font:clamp(9px,2vw,13px) Arial,sans-serif;line-height:1.6;margin-top:12px;color:#fff8e9}.hint{font:12px Arial,sans-serif;color:#6e6570;text-align:center;margin:10px}@media(max-width:480px){.page{padding:8px}.events{gap:5px}.events button{padding:7px 10px;font-size:11px}.overlay{top:38%;height:33%}}
</style></head><body><main class="page"><nav class="events" id="events" aria-label="Invitation events"></nav><section class="artboard"><img id="event-image" src="image/1.%20Wedding%20Invitation.png" alt="Wedding invitation artwork"><div class="overlay"><p class="eyebrow">The Wedding Of</p><h1 class="names"><span id="groom">Aarav</span><span class="amp"> &amp; </span><span id="bride">Riya</span></h1><div class="details"><span id="date">20 December 2026</span><br><span id="time">7:00 PM</span><br><span id="venue">Surat, Gujarat</span></div></div></section><p class="hint">Select an event above to preview its original artwork.</p></main>
<script>
const events=[{name:"Wedding Invitation",file:"1. Wedding Invitation.png"},{name:"Grah Shanti",file:"2. Grah Shanti.png"},{name:"Haldi",file:"3. Haldi.png"},{name:"Raas Garba",file:"4. Raas Garba.png"},{name:"Hast Melap",file:"5. Hast Melap.png"},{name:"Reception",file:"6. Reception.png"}];
const p=new URLSearchParams(location.search);for(const k of ["groom","bride","date","time","venue"]){const e=document.getElementById(k);if(e&&p.has(k))e.textContent=p.get(k)}
const nav=document.getElementById("events"),img=document.getElementById("event-image");events.forEach((ev,i)=>{const b=document.createElement("button");b.textContent=ev.name;b.type="button";b.className=i===0?"active":"";b.onclick=()=>{img.src="image/"+encodeURIComponent(ev.file);img.alt=ev.name+" original invitation artwork";nav.querySelectorAll("button").forEach(x=>x.classList.remove("active"));b.classList.add("active")};nav.appendChild(b)});
</script></body></html>
