<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Template 01 · Royal Burgundy & Gold</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2efed;font-family:Arial,sans-serif;color:#4b1024}.page{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px}.events{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 auto 10px;max-width:1000px}.events button{border:1px solid #b99a54;border-radius:20px;background:#fff;color:#4b1024;padding:8px 12px;cursor:pointer;font:12px Arial,sans-serif}.events button.active{background:#4b1024;color:#f4d47e}.artboard{position:relative;width:min(100%,520px);line-height:0}.artboard img{display:block;width:100%;height:auto;object-fit:contain}.overlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76%;height:58%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.3;color:#8d2d20;text-shadow:0 1px 1px #fff5d8;pointer-events:none;overflow:hidden}.eyebrow,.footer-text{font:clamp(8px,1.8vw,12px) Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;margin:0 0 9px}.event-title{font-size:clamp(17px,4vw,26px);margin:0 0 9px;line-height:1.15}.names{font-size:clamp(22px,5.8vw,36px);margin:0;line-height:1.12;font-weight:600}.amp{font-size:.7em;margin:2px 0}.details{font:clamp(9px,1.9vw,12px) Arial,sans-serif;line-height:1.5;margin-top:9px;color:#6f241c}.footer-text{margin:10px 0 0;font-size:clamp(7px,1.5vw,10px)}.hint{font:12px Arial,sans-serif;color:#6e6570;text-align:center;margin:8px}@media(max-width:480px){.page{padding:6px}.events{gap:4px}.events button{padding:6px 9px;font-size:10px}}
</style></head><body><main class="page"><nav class="events" id="events" aria-label="Invitation events"></nav><section class="artboard"><img id="event-image" src="image/1.%20Wedding%20Invitation.png" alt="Wedding invitation artwork"><div class="overlay" id="overlay"><p class="eyebrow" id="eyebrowText">TOGETHER WITH THEIR FAMILIES</p><h2 class="event-title" id="eventTitle">THE WEDDING OF</h2><h1 class="names"><span id="groom">Aarav</span><span class="amp"> &amp; </span><span id="bride">Riya</span></h1><div class="details"><span id="date">20 December 2026</span><br><span id="time">7:00 PM</span><br><span id="venue">The Grand Palace, Surat, Gujarat</span></div><p class="footer-text" id="footerText">JOYFULLY INVITE YOU TO CELEBRATE</p></div></section><p class="hint">Sample template · select an event to view its original artwork.</p></main>
<script>
const events=[{name:"Wedding Invitation",file:"1. Wedding Invitation.png",title:"THE WEDDING OF",time:"7:00 PM"},{name:"Grah Shanti",file:"2. Grah Shanti.png",title:"GRAH SHANTI CEREMONY",time:"10:00 AM"},{name:"Haldi",file:"3. Haldi.png",title:"HALDI CEREMONY",time:"9:00 AM"},{name:"Raas Garba",file:"4. Raas Garba.png",title:"RAAS GARBA NIGHT",time:"7:00 PM"},{name:"Hast Melap",file:"5. Hast Melap.png",title:"HAST MELAP CEREMONY",time:"7:00 PM"},{name:"Reception",file:"6. Reception.png",title:"WEDDING RECEPTION",time:"7:00 PM"}];
const p=new URLSearchParams(location.search);for(const k of ["groom","bride","date","time","venue","eyebrowText","eventTitle","footerText"]){if(p.has(k))document.getElementById(k).textContent=p.get(k)}
const overlay=document.getElementById("overlay");overlay.style.fontFamily=p.get("fontFamily")||"Georgia,serif";overlay.style.fontSize=(Number(p.get("fontSize"))||30)+"px";overlay.style.color=p.get("textColor")||"#8d2d20";overlay.style.textAlign=p.get("align")||"center";overlay.style.left=(Number(p.get("posX"))||50)+"%";overlay.style.top=(Number(p.get("posY"))||50)+"%";
const nav=document.getElementById("events"),img=document.getElementById("event-image");events.forEach((ev,i)=>{const b=document.createElement("button");b.textContent=ev.name;b.type="button";b.className=i===0?"active":"";b.onclick=()=>{img.src="image/"+encodeURIComponent(ev.file);img.alt=ev.name+" original invitation artwork";document.getElementById("eventTitle").textContent=ev.title;document.getElementById("time").textContent=ev.time;nav.querySelectorAll("button").forEach(x=>x.classList.remove("active"));b.classList.add("active")};nav.appendChild(b)});
</script></body></html>
