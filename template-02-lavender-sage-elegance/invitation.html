<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wedding Invitation Preview</title><style>:root{--bg:#4b1024;--gold:#d7b56d;--paper:#fff6e6}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e9e9ed;padding:20px;font-family:Georgia,"Times New Roman",serif}.invite{position:relative;width:min(100%,560px);min-height:740px;background:var(--bg);color:var(--paper);padding:48px 30px;border:2px solid var(--gold);outline:1px solid var(--gold);outline-offset:-12px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 22px 60px #0002}.kicker{letter-spacing:.22em;text-transform:uppercase;font:12px Arial,sans-serif;color:var(--gold)}h1{font-size:clamp(40px,8vw,64px);font-weight:400;color:var(--gold);margin:26px 0 8px;line-height:1.1}.amp{font-size:32px;margin:0}.ornament{color:var(--gold);font-size:30px;margin:18px 0}.date{font:16px Arial,sans-serif;letter-spacing:.08em;margin:22px 0 8px}.details{font:13px Arial,sans-serif;line-height:1.8}.badge{position:absolute;bottom:20px;font:10px Arial,sans-serif;letter-spacing:.15em;color:var(--gold)}@media(max-width:480px){.invite{min-height:680px;padding:34px 20px}}</style></head><body><main class="invite"><div class="kicker">Together with their families</div><div class="ornament">❦</div><div class="kicker">Joyfully invite you to celebrate</div><h1 id="groom">Aarav</h1><p class="amp">&amp;</p><h1 id="bride">Riya</h1><div class="ornament">✧ ❦ ✧</div><div class="date" id="date">20 December 2026</div><div class="details">Wedding Celebration · <span id="time">7:00 PM</span><br><span id="venue">Surat, Gujarat</span></div><div class="badge" id="theme-title">INVITATION PREVIEW</div></main><script>const p=new URLSearchParams(location.search);for(const k of ["groom","bride","date","time","venue"]){const e=document.getElementById(k);if(e&&p.has(k))e.textContent=p.get(k)}fetch("template.json").then(r=>r.json()).then(t=>{document.documentElement.style.setProperty("--bg",t.bg);document.documentElement.style.setProperty("--gold",t.accent);document.documentElement.style.setProperty("--paper",t.light);document.getElementById("theme-title").textContent=t.title.toUpperCase()}).catch(()=>{});</script></body></html>
