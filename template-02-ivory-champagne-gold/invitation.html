<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f0e5">
  <meta name="description" content="Ivory and champagne-gold wedding invitation preview.">
  <title>Ivory & Champagne Gold — Wedding Invitation Preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #f7f0e5; }
    body { min-height: 100vh; }
    .preview { position: relative; width: 100%; min-height: 100vh; overflow: hidden; }
    iframe { display: block; width: 100%; height: 100vh; min-height: 720px; border: 0; background: #f7f0e5; }
    /* Prevent visitors from clicking Canva controls or navigating away from the preview. */
    .interaction-shield { position: absolute; inset: 0; z-index: 2; background: transparent; }
    @media (max-width: 600px) {
      iframe { min-height: 100vh; height: 100vh; }
    }
  </style>
</head>
<body>
  <main class="preview" aria-label="Wedding invitation preview">
    <iframe
      src="https://canva.link/ajwtf5mxm93d9u1"
      title="Original Canva ivory and champagne-gold wedding invitation"
      loading="eager"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen>
    </iframe>
    <div class="interaction-shield" aria-hidden="true"></div>
  </main>
</body>
</html>
